name: Auto-Scan Job Portals (7 AM & 2 PM Peru)

on:
  schedule:
    # 12:17 UTC = 07:17 AM Hora Perú (UTC-5) — minuto fuera de :00 para evitar congestión en GitHub Actions
    - cron: "17 12 * * *"
    # 19:23 UTC = 02:23 PM Hora Perú (UTC-5) — minuto fuera de :00 para evitar congestión en GitHub Actions
    - cron: "23 19 * * *"
  workflow_dispatch: # Permite ejecutar el escaneo en la nube manualmente con 1 clic en GitHub

permissions:
  contents: read

jobs:
  scrape-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validar secrets requeridos en GitHub Actions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          if [ -z "$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')" ]; then
            missing+=("SUPABASE_URL")
          fi
          if [ -z "$(printf '%s' "$SUPABASE_SERVICE_ROLE_KEY" | tr -d '[:space:]')" ]; then
            missing+=("SUPABASE_SERVICE_ROLE_KEY")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Faltan Secrets en GitHub Actions::Faltan los secrets ${missing[*]} en Settings > Secrets and variables > Actions del repositorio."
            exit 1
          fi
          if [ -z "$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]')" ]; then
            echo "::warning title=GEMINI_API_KEY no configurada::Falta GEMINI_API_KEY en Secrets; el pipeline usará evaluación heurística."
          fi

      - name: Clonar repositorio
        uses: actions/checkout@v7

      - name: Configurar Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "services/pipeline/requirements.txt"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r services/pipeline/requirements.txt

      - name: Ejecutar Radar Multi-Portal y Persistir en Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python services/pipeline/run.py --limit 40 --backend supabase
