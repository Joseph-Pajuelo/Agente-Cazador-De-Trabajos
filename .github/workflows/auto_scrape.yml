name: Auto-Scan Job Portals (7 AM & 2 PM Peru)

on:
  schedule:
    # 12:00 UTC = 07:00 AM Hora Perú (UTC-5)
    - cron: "0 12 * * *"
    # 19:00 UTC = 02:00 PM Hora Perú (UTC-5)
    - cron: "0 19 * * *"
  workflow_dispatch: # Permite ejecutar el escaneo en la nube manualmente con 1 clic en GitHub

permissions:
  contents: read

jobs:
  scrape-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "services/pipeline/requirements.txt"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r services/pipeline/requirements.txt

      - name: Ejecutar Radar Multi-Portal y Persistir en Supabase
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python services/pipeline/run.py --limit 40 --no-pdf --backend supabase
