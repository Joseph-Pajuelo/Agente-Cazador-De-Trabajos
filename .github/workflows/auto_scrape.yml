name: Auto-Scan Job Portals (7 AM & 2 PM Peru)

on:
  schedule:
    # 12:00 UTC = 07:00 AM Hora Perú (UTC-5)
    - cron: "0 12 * * *"
    # 19:00 UTC = 02:00 PM Hora Perú (UTC-5)
    - cron: "0 19 * * *"
  workflow_dispatch: # Permite ejecutar el escaneo en la nube manualmente con 1 clic en GitHub

permissions:
  contents: write

jobs:
  scrape-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Radar Multi-Portal (5 fuentes + IA / Circuit Breaker)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run.py --limit 10 --no-pdf

      - name: Guardar nuevas vacantes en el repositorio (Actualiza Streamlit Cloud automáticamente)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jobs.db storage/crm_memory.json
          if git diff --staged --quiet; then
            echo "No hubo cambios en la base de datos en esta ejecución."
          else
            git commit -m "chore(radar): actualización automática de vacantes [skip ci]"
            git pull --rebase origin main
            git push origin main
            echo "¡Base de datos actualizada y sincronizada con Streamlit Cloud!"
          fi
