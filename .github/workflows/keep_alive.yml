name: Keep Streamlit App Awake 24/7

on:
  schedule:
    # Se ejecuta automáticamente cada 6 horas para mantener el contenedor activo
    - cron: "0 */6 * * *"
  workflow_dispatch: # Permite probarlo manualmente desde la pestaña Actions en GitHub

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Playwright (Chromium ligero)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Despertar y mantener activa la App en Streamlit Cloud
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL || vars.STREAMLIT_APP_URL || 'https://agente-cazador-de-trabajos-4fdczfbzzkmw3tfuipjwek.streamlit.app/' }}
        run: |
          python - << 'EOF'
          import os, sys, time
          from playwright.sync_api import sync_playwright

          url = (os.environ.get("STREAMLIT_APP_URL") or "").strip()
          if not url:
              print("No se definió STREAMLIT_APP_URL. Saltando ping.")
              sys.exit(0)

          print(f"[Keep-Alive] Visitando {url} ...")
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              try:
                  page.goto(url, wait_until="domcontentloaded", timeout=45000)
                  page.wait_for_timeout(5000)

                  # Si Streamlit Cloud durmió la app, hacer clic en el botón de despertar
                  wake_btn = page.locator("button:has-text('Yes, get this app back up')").or_(
                      page.locator("button:has-text('get this app back up')")
                  )
                  if wake_btn.count() > 0:
                      print("[Keep-Alive] La app estaba dormida. Despertándola automáticamente...")
                      wake_btn.first.click()
                      page.wait_for_timeout(15000)
                  else:
                      print("[Keep-Alive] La app ya está despierta y con WebSocket activo.")

                  page.wait_for_timeout(5000)
                  print("[Keep-Alive] Ping completado exitosamente.")
              except Exception as exc:
                  print(f"[Keep-Alive] Aviso durante el ping: {exc}")
              finally:
                  browser.close()
          EOF
